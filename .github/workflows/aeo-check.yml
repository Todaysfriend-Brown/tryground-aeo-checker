name: AEO 인용률 주간 체크

on:
  schedule:
    # 매주 월요일 05:37 (KST) = UTC 일요일 20:37 (한국이 UTC+9)
    # 예전엔 월 09:00(KST)로 걸어뒀지만, GitHub 스케줄은 붐비는 정각(특히 UTC 자정)에 3~4시간씩 밀려
    # 실제 결과는 12~13시에 왔다. 오전 9시 전에 받으려고 새벽으로 당기고, 혼잡한 정각을 피해 37분으로 둔다.
    # 날짜는 aeo_checker.py가 KST로 계산하므로 UTC로 일요일이어도 '월요일 날짜'로 기록된다.
    - cron: '37 20 * * 0'
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: '재빌드 전용 (API 호출 없이 기존 데이터로 페이지만 다시 생성 - 비용 0원)'
        required: false
        type: boolean
        default: false

jobs:
  check-aeo:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        # google-genai는 마지막으로 정상 동작한 2.x대로 고정 (3.0.0에서 기본 API 버전이 바뀌어 11/9 실행이 깨졌음).
        # 올릴 때는 새 버전으로 한 번 직접 돌려보고 올린다.
        run: pip install openai "google-genai>=2.34,<3" anthropic

      - name: 자동 검증 테스트 (API 호출 없음 - 로직이 깨졌으면 비용을 쓰기 전에 여기서 중단)
        run: python -m unittest discover -s tests -p "test_quality.py" -v

      - name: AEO 체크 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.rebuild_only }}" = "true" ]; then
            python aeo_checker.py --rebuild-only
          else
            python aeo_checker.py
          fi

      - name: 결과 커밋 & 푸시
        if: ${{ !cancelled() }}   # 위 단계가 '통계 제외'로 실패(exit 1)해도 이미 저장된 결과는 커밋
        run: |
          git config --global user.name "AEO Bot"
          git config --global user.email "aeo-bot@tryground.co.kr"
          git add aeo_results/ spaceup_results/   # 프로젝트별 결과 폴더 (aeo_checker.py PROJECTS의 output_dir)
          git diff --staged --quiet || git commit -m "AEO 체크 결과 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - name: Slack 알림 전송
        if: ${{ !cancelled() }}   # 위 단계들이 실패해도 결과를 알 수 있도록 항상 시도
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "ℹ SLACK_WEBHOOK_URL 시크릿이 없어 Slack 알림을 건너뜁니다. (설정 방법은 README 참고)"
            exit 0
          fi
          python aeo_checker.py --slack-payload > slack_payload.json
          curl -sf -X POST -H 'Content-type: application/json' --data @slack_payload.json "$SLACK_WEBHOOK_URL"
